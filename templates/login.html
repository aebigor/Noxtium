{% extends "base.html" %}
{% block title %}Iniciar sesión · NOXTIUM{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card">
  <div class="eyebrow">NOXTIUM / CUENTA</div><h1>Entra a tu plataforma</h1>
  <p>Accede a tus servicios, pagos y configuración de WhatsApp.</p>
  <form class="auth-form" method="POST" action="{{ url_for('portal.login_post') }}">
    <label for="correo">Correo</label><input type="email" id="correo" name="correo" placeholder="tucorreo@empresa.com" required>
    <label for="password">Contraseña</label><input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
    <button class="btn btn--primary btn--lg" type="submit">Iniciar sesión</button>
  </form>
  <p class="auth-foot">¿Todavía no tienes cuenta? <a href="{{ url_for('portal.register') }}">Crear cuenta</a></p>
</div></section>
{% endblock %}
