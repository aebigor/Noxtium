{% extends "base.html" %}
{% block title %}Crear cuenta · NOXTIUM{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card">
  <div class="eyebrow">NOXTIUM / REGISTRO</div><h1>Comienza tu transformación</h1>
  <p>Crea tu cuenta. El servicio se activa únicamente después de confirmar el pago.</p>
  <form class="auth-form" method="POST" action="{{ url_for('portal.register_post') }}">
    <label for="nombre">Nombre completo</label><input id="nombre" name="nombre" required>
    <label for="empresa">Nombre del negocio</label><input id="empresa" name="empresa" required>
    <label for="correo">Correo</label><input type="email" id="correo" name="correo" required>
    <label for="password">Contraseña</label><input type="password" id="password" name="password" minlength="8" required>
    <button class="btn btn--primary btn--lg" type="submit">Crear cuenta</button>
  </form>
  <p class="auth-foot">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
</div></section>
{% endblock %}
