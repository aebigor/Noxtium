{% extends "base.html" %}
{% block title %}Preconsulta gratuita · NOXTIUM{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card" style="max-width:760px"><div class="eyebrow">NOXTIUM · CRECE CONTIGO</div><h1>Agenda tu preconsulta gratuita</h1><p>Cuéntanos qué necesita tu negocio. Coordinaremos la reunión por WhatsApp o correo electrónico.</p>
<form class="auth-form" method="POST" action="{{ url_for('portal.submit_consultation') }}"><label for="contact_method">¿Cómo prefieres que te contactemos?</label><select id="contact_method" name="contact_method" required><option value="whatsapp">WhatsApp</option><option value="email">Correo electrónico</option></select><label for="contact_value">Número de WhatsApp o correo</label><input id="contact_value" name="contact_value" required placeholder="+57 300... o correo@empresa.com"><label>Módulos que te interesan</label><div class="feature-list"><label><input type="checkbox" name="modules" value="Caja y ventas"> Caja y ventas</label><label><input type="checkbox" name="modules" value="Inventario"> Inventario</label><label><input type="checkbox" name="modules" value="CRM y clientes"> CRM y clientes</label><label><input type="checkbox" name="modules" value="Reportes"> Reportes</label><label><input type="checkbox" name="modules" value="WhatsApp y agente de IA"> WhatsApp y agente de IA</label><label><input type="checkbox" name="modules" value="Integraciones y automatización n8n"> Integraciones y automatización n8n</label><label><input type="checkbox" name="modules" value="Otro / por definir"> Otro / por definir</label></div><label for="preferred_date">Fecha preferida (opcional)</label><input id="preferred_date" name="preferred_date" placeholder="Ej. 20/10/2026"><label for="preferred_time">Horario preferido (opcional)</label><input id="preferred_time" name="preferred_time" placeholder="Ej. 10:00 a. m."><label for="business_description">Cuéntanos sobre tu negocio y qué quieres mejorar</label><textarea id="business_description" name="business_description" rows="4" placeholder="Caja, inventario, ventas, clientes... "></textarea><button class="btn btn--primary btn--lg" type="submit">Solicitar preconsulta gratuita</button></form></div></section>
{% endblock %}
